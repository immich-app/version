---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmrule_v1beta1.json
#
# version:* recording rules. Ported from immich-app/devtools
# kubernetes/apps/monitoring/victoria-metrics/app/vmrule-version-worker.yaml
# (fc69e6d8). The changes are marked "Changed" below.
#
# Shipped in the signed o11y bundle (o11y/render-manifests.sh). On the o11y
# clusters the version tenant's own vmalert evaluates them: it selects VMRules
# by the o11y.futo.org/tenant label (which o11y also stamps on everything in
# this bundle), reads only the version tenant, and adds the identity labels
# (project, cluster, env, provider, region) to every result, which is what routes
# the results back into that tenant. o11y's own vmalert skips them.
#
# No namespace: o11y's Kustomization sets targetNamespace. No dollar-brace
# variables either: Flux substitutes them on the way in.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: version-recording
  labels:
    o11y.futo.org/tenant: version
spec:
  groups:
    # Per-5m markers computed over raw data.
    - name: version-worker.base
      interval: 5m
      rules:
        - record: version:server_seen:count5m
          expr: |-
            count by (client_ip) (count_over_time(version_version_request_invocation{user_agent=~"immich-server/.*"}[5m]) or count_over_time(version_changelog_request_invocation{user_agent=~"immich-server/.*"}[5m]))
        - record: version:server_seen_vreq:count5m
          expr: |-
            count by (client_ip) (count_over_time(version_version_request_invocation{user_agent=~"immich-server/.*"}[5m]))
        - record: version:server_seen_continent:count5m
          expr: |-
            count by (client_ip, continent) (count_over_time(version_version_request_invocation{user_agent=~"immich-server/.*"}[5m]) or count_over_time(version_changelog_request_invocation{user_agent=~"immich-server/.*"}[5m]))
        - record: version:server_version_seen:count5m
          expr: |-
            count by (client_ip, user_agent) (count_over_time(version_version_request_invocation{user_agent=~"immich-server/.*"}[5m]) or count_over_time(version_changelog_request_invocation{user_agent=~"immich-server/.*"}[5m]))
        - record: version:server_version_seen_vreq:count5m
          expr: |-
            count by (client_ip, user_agent) (count_over_time(version_version_request_invocation{user_agent=~"immich-server/.*"}[5m]))
        - record: version:requests:count5m
          expr: |-
            sum(count_over_time(version_handle_request_invocation[5m]))
        - record: version:requests_by_colo:count5m
          expr: |-
            sum by (colo) (count_over_time(version_handle_request_invocation{colo!=""}[5m]))
        - record: version:memory_cache_hit:count5m
          expr: |-
            sum(count_over_time(version_memory_cache_hit_count[5m]))
        - record: version:memory_cache_stale:count5m
          expr: |-
            sum(count_over_time(version_memory_cache_stale_count[5m]))
        - record: version:memory_cache_miss:count5m
          expr: |-
            sum(count_over_time(version_memory_cache_miss_count[5m]))
        - record: version:requests_immich:count5m
          expr: |-
            (sum(count_over_time(version_version_request_invocation{user_agent=~"immich-server/.*"}[5m])) or vector(0)) + (sum(count_over_time(version_changelog_request_invocation{user_agent=~"immich-server/.*"}[5m])) or vector(0))
        - record: version:requests_other:count5m
          expr: |-
            (sum(count_over_time(version_version_request_invocation{user_agent!~"immich-server/.*",user_agent!=""}[5m])) or vector(0)) + (sum(count_over_time(version_changelog_request_invocation{user_agent!~"immich-server/.*",user_agent!=""}[5m])) or vector(0))
    # Derived from base rule series only (never raw). eval_offset ensures the
    # async remote-write of the base group has landed before evaluation.
    - name: version-worker.derived
      interval: 5m
      eval_offset: 2m30s
      rules:
        - record: version:servers_unique:2h
          expr: |-
            count(count_over_time(version:server_seen:count5m[2h]))
        - record: version:servers_unique:24h
          expr: |-
            count(count_over_time(version:server_seen:count5m[24h]))
        # The five [30d]-offset rules (servers_new:5m, :1h and :1d, servers_upgrades:1h,
        # servers_new_installs:1h) are sharded by client_ip. Changed: devtools ran them
        # unsharded. Under a set operation the [30d] rollup is budgeted at about 1016 B
        # per IP, and o11y vmselect caps a query at -search.maxMemoryPerQuery=1GB,
        # which a month of production servers can exceed (devtools counted about 1.37M
        # IPs in 30d): the unsharded rule then fails with a 422. VictoriaMetrics
        # evaluates the + chain one term at a time, so each shard stays under the cap.
        # The shards split on the last character of client_ip (IPv4 decimal and
        # IPv6 hex digits); the fourth is the
        # complement of the other three, so together they partition every value,
        # including `::`-suffixed IPv6, upper-case hex and an empty client_ip. The
        # shard filter is on both sides of every set operation, and `or vector(0)`
        # keeps an empty shard from blanking the sum (a window with no new servers
        # records 0).
        - record: version:servers_new:5m
          expr: |-
            (count(count_over_time(version:server_seen:count5m{client_ip=~".*[048c]"}[5m]) unless count_over_time(version:server_seen:count5m{client_ip=~".*[048c]"}[30d] offset 5m)) or vector(0))
            + (count(count_over_time(version:server_seen:count5m{client_ip=~".*[159d]"}[5m]) unless count_over_time(version:server_seen:count5m{client_ip=~".*[159d]"}[30d] offset 5m)) or vector(0))
            + (count(count_over_time(version:server_seen:count5m{client_ip=~".*[26ae]"}[5m]) unless count_over_time(version:server_seen:count5m{client_ip=~".*[26ae]"}[30d] offset 5m)) or vector(0))
            + (count(count_over_time(version:server_seen:count5m{client_ip!~".*[01245689acde]"}[5m]) unless count_over_time(version:server_seen:count5m{client_ip!~".*[01245689acde]"}[30d] offset 5m)) or vector(0))
        - record: version:servers_new:1h
          expr: |-
            (count(count_over_time(version:server_seen:count5m{client_ip=~".*[048c]"}[1h]) unless count_over_time(version:server_seen:count5m{client_ip=~".*[048c]"}[30d] offset 1h)) or vector(0))
            + (count(count_over_time(version:server_seen:count5m{client_ip=~".*[159d]"}[1h]) unless count_over_time(version:server_seen:count5m{client_ip=~".*[159d]"}[30d] offset 1h)) or vector(0))
            + (count(count_over_time(version:server_seen:count5m{client_ip=~".*[26ae]"}[1h]) unless count_over_time(version:server_seen:count5m{client_ip=~".*[26ae]"}[30d] offset 1h)) or vector(0))
            + (count(count_over_time(version:server_seen:count5m{client_ip!~".*[01245689acde]"}[1h]) unless count_over_time(version:server_seen:count5m{client_ip!~".*[01245689acde]"}[30d] offset 1h)) or vector(0))
        # Changed: `and on(client_ip)`. The left side keeps only client_ip and the
        # right also carries the identity labels this tenant's vmalert adds, so a
        # bare `and` matches nothing (devtools' vmalert added none).
        - record: version:servers_upgrades:1h
          expr: |-
            (count(count by (client_ip) (count_over_time(version:server_version_seen_vreq:count5m{client_ip=~".*[048c]"}[1h]) and on(user_agent) last_over_time(version_latest_version_count[3h])) and on(client_ip) count_over_time(version:server_seen_vreq:count5m{client_ip=~".*[048c]"}[30d] offset 1h)) or vector(0))
            + (count(count by (client_ip) (count_over_time(version:server_version_seen_vreq:count5m{client_ip=~".*[159d]"}[1h]) and on(user_agent) last_over_time(version_latest_version_count[3h])) and on(client_ip) count_over_time(version:server_seen_vreq:count5m{client_ip=~".*[159d]"}[30d] offset 1h)) or vector(0))
            + (count(count by (client_ip) (count_over_time(version:server_version_seen_vreq:count5m{client_ip=~".*[26ae]"}[1h]) and on(user_agent) last_over_time(version_latest_version_count[3h])) and on(client_ip) count_over_time(version:server_seen_vreq:count5m{client_ip=~".*[26ae]"}[30d] offset 1h)) or vector(0))
            + (count(count by (client_ip) (count_over_time(version:server_version_seen_vreq:count5m{client_ip!~".*[01245689acde]"}[1h]) and on(user_agent) last_over_time(version_latest_version_count[3h])) and on(client_ip) count_over_time(version:server_seen_vreq:count5m{client_ip!~".*[01245689acde]"}[30d] offset 1h)) or vector(0))
        # Changed: `unless on(client_ip)`, for the same reason: a bare `unless`
        # removes nothing and counts every upgrade as a new install.
        - record: version:servers_new_installs:1h
          expr: |-
            (count(count by (client_ip) (count_over_time(version:server_version_seen_vreq:count5m{client_ip=~".*[048c]"}[1h]) and on(user_agent) last_over_time(version_latest_version_count[3h])) unless on(client_ip) count_over_time(version:server_seen_vreq:count5m{client_ip=~".*[048c]"}[30d] offset 1h)) or vector(0))
            + (count(count by (client_ip) (count_over_time(version:server_version_seen_vreq:count5m{client_ip=~".*[159d]"}[1h]) and on(user_agent) last_over_time(version_latest_version_count[3h])) unless on(client_ip) count_over_time(version:server_seen_vreq:count5m{client_ip=~".*[159d]"}[30d] offset 1h)) or vector(0))
            + (count(count by (client_ip) (count_over_time(version:server_version_seen_vreq:count5m{client_ip=~".*[26ae]"}[1h]) and on(user_agent) last_over_time(version_latest_version_count[3h])) unless on(client_ip) count_over_time(version:server_seen_vreq:count5m{client_ip=~".*[26ae]"}[30d] offset 1h)) or vector(0))
            + (count(count by (client_ip) (count_over_time(version:server_version_seen_vreq:count5m{client_ip!~".*[01245689acde]"}[1h]) and on(user_agent) last_over_time(version_latest_version_count[3h])) unless on(client_ip) count_over_time(version:server_seen_vreq:count5m{client_ip!~".*[01245689acde]"}[30d] offset 1h)) or vector(0))
        - record: version:servers_by_version:24h
          expr: |-
            count by (user_agent) (count_over_time(version:server_version_seen:count5m[24h]))
        - record: version:servers_by_version_vreq:2h
          expr: |-
            count by (user_agent) (count_over_time(version:server_version_seen_vreq:count5m[2h]))
        - record: version:servers_by_continent:24h
          expr: |-
            count by (continent) (count_over_time(version:server_seen_continent:count5m[24h]))
        - record: version:servers_uptodate_ratio:24h
          expr: |-
            count(count by (client_ip, user_agent) (count_over_time(version:server_version_seen_vreq:count5m[24h])) and on(user_agent) last_over_time(version_latest_version_count[3h])) / count(count_over_time(version:server_seen_vreq:count5m[24h]))
        - record: version:servers_ipv4:24h
          expr: |-
            count(count_over_time(version:server_seen:count5m{client_ip!~".*:.*",client_ip!=""}[24h]))
        - record: version:servers_ipv6:24h
          expr: |-
            count(count_over_time(version:server_seen:count5m{client_ip=~".*:.*"}[24h]))
    # Slow-moving 30d aggregates.
    - name: version-worker.derived-30d
      interval: 30m
      eval_offset: 2m30s
      rules:
        - record: version:servers_unique:30d
          expr: |-
            count(count_over_time(version:server_seen:count5m[30d]))
        # Sharded like servers_new:5m above.
        - record: version:servers_new:1d
          expr: |-
            (count(count_over_time(version:server_seen:count5m{client_ip=~".*[048c]"}[1d]) unless count_over_time(version:server_seen:count5m{client_ip=~".*[048c]"}[30d] offset 1d)) or vector(0))
            + (count(count_over_time(version:server_seen:count5m{client_ip=~".*[159d]"}[1d]) unless count_over_time(version:server_seen:count5m{client_ip=~".*[159d]"}[30d] offset 1d)) or vector(0))
            + (count(count_over_time(version:server_seen:count5m{client_ip=~".*[26ae]"}[1d]) unless count_over_time(version:server_seen:count5m{client_ip=~".*[26ae]"}[30d] offset 1d)) or vector(0))
            + (count(count_over_time(version:server_seen:count5m{client_ip!~".*[01245689acde]"}[1d]) unless count_over_time(version:server_seen:count5m{client_ip!~".*[01245689acde]"}[30d] offset 1d)) or vector(0))
